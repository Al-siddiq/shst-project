name: Blocks 1-3 stabilization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: find app tests -name '*.php' -print0 | xargs -0 -n20 php -l
      - run: vendor/bin/phpunit --testsuite App
      - run: composer audit --locked --no-dev
      - run: npm audit --omit=dev --audit-level=high

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: shst_test
          MYSQL_USER: shst_test
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, mysqli
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Run integration suite on production engine
        run: >-
          env CI_ENVIRONMENT=testing
          'database.tests.hostname=127.0.0.1'
          'database.tests.database=shst_test'
          'database.tests.username=shst_test'
          'database.tests.password=test-only-password'
          'database.tests.DBDriver=MySQLi'
          'database.tests.DBPrefix=test_'
          vendor/bin/phpunit --testsuite App
